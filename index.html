<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0f1b2d" />
<title>SW — Birds Flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0f1b2d; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    touch-action: manipulation; user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.55); cursor: pointer; }
  #hint {
    position: fixed; bottom: 10px; width: 100%; text-align: center;
    color: rgba(255,255,255,.35); font-size: 12px; letter-spacing: .08em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">SPACE / CLICK / TAP TO FLAP &nbsp;·&nbsp; M TO MUTE</div>
<script>
(() => {
  "use strict";

  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d");

  // Logical resolution — everything is drawn in these coordinates.
  const W = 420, H = 700;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
    cvs.style.width = W * scale + "px";
    cvs.style.height = H * scale + "px";
    cvs.width = Math.round(W * scale * DPR);
    cvs.height = Math.round(H * scale * DPR);
    ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  // ---------------------------------------------------------------- tuning
  const GRAVITY = 1500;
  const FLAP = -430;
  const PIPE_W = 72;
  const GAP = 172;
  const SPACING = 240;
  const BASE_SPEED = 168;
  const MAX_SPEED = 300;
  const GROUND_H = 96;
  const FLOOR_Y = H - GROUND_H;

  // ---------------------------------------------------------------- audio
  let ac = null, muted = false;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === "suspended") ac.resume();
  }
  function tone(f1, f2, dur, type, vol) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f1, ac.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  }
  const sfx = {
    flap:  () => tone(420, 620, 0.08, "triangle", 0.05),
    score: () => { tone(880, 0, 0.07, "square", 0.04); setTimeout(() => tone(1320, 0, 0.09, "square", 0.04), 70); },
    hit:   () => tone(220, 60, 0.28, "sawtooth", 0.07),
    fall:  () => tone(180, 40, 0.5, "sine", 0.05),
  };

  // ---------------------------------------------------------------- state
  const bird = { x: W * 0.3, y: H * 0.45, vy: 0, r: 14, rot: 0, wing: 0, wingDir: 1 };
  const G = {
    state: "ready",     // ready | play | over
    score: 0,
    best: Number(localStorage.getItem("sw_best") || 0) | 0,
    pipes: [],
    parts: [],
    clouds: [],
    t: 0,
    speed: BASE_SPEED,
    groundOff: 0,
    shake: 0,
    overAt: 0,
    flash: 0,
  };

  function makeClouds() {
    G.clouds = [];
    for (let i = 0; i < 9; i++) {
      G.clouds.push({
        x: Math.random() * W,
        y: 40 + Math.random() * 300,
        s: 0.55 + Math.random() * 0.9,
        v: 6 + Math.random() * 14,
        a: 0.35 + Math.random() * 0.4,
      });
    }
  }
  makeClouds();

  function reset() {
    bird.y = H * 0.45; bird.vy = 0; bird.rot = 0;
    G.score = 0; G.pipes = []; G.parts = []; G.speed = BASE_SPEED;
    G.groundOff = 0; G.shake = 0; G.t = 0;
    for (let i = 0; i < 4; i++) spawnPipe(W + 120 + i * SPACING);
  }

  function spawnPipe(x) {
    const margin = 70;
    const min = margin + GAP / 2;
    const max = FLOOR_Y - margin - GAP / 2;
    const gapY = min + Math.random() * (max - min);
    G.pipes.push({ x, gapY, passed: false });
  }

  // ---------------------------------------------------------------- input
  function flap() {
    if (G.state === "ready") {
      G.state = "play";
      reset();
      bird.vy = FLAP;
    } else if (G.state === "play") {
      bird.vy = FLAP;
      bird.wing = 1; bird.wingDir = -1;
    } else if (G.state === "over" && G.t - G.overAt > 0.45) {
      G.state = "ready";
      reset();
    }
    audio();
    sfx.flap();
    for (let i = 0; i < 3; i++) puff(bird.x - 12, bird.y + 6);
  }

  function puff(x, y) {
    G.parts.push({
      x, y,
      vx: -60 - Math.random() * 70,
      vy: (Math.random() - 0.5) * 90,
      life: 0.45, max: 0.45,
      r: 2 + Math.random() * 3,
      c: "255,255,255",
    });
  }

  function burst(x, y) {
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
      G.parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 0.9, max: 0.9,
        r: 2 + Math.random() * 4,
        c: Math.random() < 0.5 ? "255,214,102" : "255,138,76",
      });
    }
  }

  function onPointer(e) { e.preventDefault(); flap(); }
  cvs.addEventListener("pointerdown", onPointer);
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); flap(); }
    if (e.code === "KeyM") { muted = !muted; }
    if (e.code === "KeyR" && G.state !== "ready") { G.state = "ready"; reset(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && G.state === "play") { G.state = "ready"; reset(); } });

  // ---------------------------------------------------------------- update
  function die() {
    if (G.state !== "play") return;
    G.state = "over";
    G.overAt = G.t;
    G.shake = 14;
    G.flash = 1;
    sfx.hit();
    burst(bird.x, bird.y);
    if (G.score > G.best) {
      G.best = G.score;
      localStorage.setItem("sw_best", String(G.best));
    }
  }

  function circleHitsRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function update(dt) {
    G.t += dt;
    G.shake *= Math.pow(0.001, dt);
    G.flash = Math.max(0, G.flash - dt * 3.2);

    // clouds drift always
    for (const c of G.clouds) {
      c.x -= (c.v + (G.state === "play" ? G.speed * 0.12 : 0)) * dt;
      if (c.x < -90) { c.x = W + 70; c.y = 40 + Math.random() * 300; c.s = 0.55 + Math.random() * 0.9; }
    }

    // particles
    for (let i = G.parts.length - 1; i >= 0; i--) {
      const p = G.parts[i];
      p.life -= dt;
      if (p.life <= 0) { G.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 700 * dt;
    }

    if (G.state === "ready") {
      bird.y = H * 0.45 + Math.sin(G.t * 2.4) * 9;
      bird.rot = Math.sin(G.t * 2.4) * 0.12;
      bird.wing += dt * 9;
      return;
    }

    if (G.state === "over") {
      // bird falls to the ground
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      if (bird.y > FLOOR_Y - bird.r) { bird.y = FLOOR_Y - bird.r; bird.vy = 0; }
      bird.rot = Math.min(Math.PI / 2, bird.rot + dt * 6);
      return;
    }

    // ---- playing
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.35, bird.vy / 620));
    bird.wing += dt * (bird.wingDir < 0 ? 26 : 10);
    if (bird.wing > 1) { bird.wing = 1; bird.wingDir = 1; }

    // ceiling
    if (bird.y < bird.r) { bird.y = bird.r; bird.vy = Math.max(bird.vy, 0); }

    // ground
    if (bird.y + bird.r >= FLOOR_Y) { bird.y = FLOOR_Y - bird.r; die(); return; }

    G.speed = Math.min(MAX_SPEED, BASE_SPEED + G.score * 4.5);
    G.groundOff = (G.groundOff + G.speed * dt) % 28;

    for (const p of G.pipes) p.x -= G.speed * dt;

    // scoring + culling + spawn
    const last = G.pipes[G.pipes.length - 1];
    if (last && last.x < W - SPACING) spawnPipe(last.x + SPACING);
    if (G.pipes.length && G.pipes[0].x + PIPE_W < -40) G.pipes.shift();

    for (const p of G.pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        G.score++;
        sfx.score();
        G.flash = Math.max(G.flash, 0.18);
        for (let i = 0; i < 8; i++) {
          G.parts.push({
            x: bird.x + 10, y: bird.y,
            vx: 40 + Math.random() * 90, vy: (Math.random() - 0.5) * 160,
            life: 0.5, max: 0.5, r: 1.5 + Math.random() * 2.5, c: "255,224,130",
          });
        }
      }
      // collision
      const topH = p.gapY - GAP / 2;
      if (circleHitsRect(bird.x, bird.y, bird.r - 2, p.x, 0, PIPE_W, topH) ||
          circleHitsRect(bird.x, bird.y, bird.r - 2, p.x, p.gapY + GAP / 2, PIPE_W, FLOOR_Y - (p.gapY + GAP / 2))) {
        die();
        return;
      }
    }
  }

  // ---------------------------------------------------------------- drawing
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawSky() {
    const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    sky.addColorStop(0, "#2b5c8a");
    sky.addColorStop(0.42, "#5fa3c4");
    sky.addColorStop(0.78, "#9fd4d6");
    sky.addColorStop(1, "#e6dcb8");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, FLOOR_Y);

    // sun glow
    const gx = W * 0.76, gy = 128;
    const glow = ctx.createRadialGradient(gx, gy, 6, gx, gy, 130);
    glow.addColorStop(0, "rgba(255,246,214,.95)");
    glow.addColorStop(0.25, "rgba(255,230,160,.42)");
    glow.addColorStop(1, "rgba(255,230,160,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(gx, gy, 130, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff6d6";
    ctx.beginPath(); ctx.arc(gx, gy, 34, 0, Math.PI * 2); ctx.fill();

    // distant hills (parallax)
    const off = (G.state === "play" ? G.groundOff * 0.6 : 0);
    ctx.fillStyle = "rgba(76,126,140,.55)";
    ctx.beginPath();
    ctx.moveTo(0, FLOOR_Y);
    for (let x = -40; x <= W + 40; x += 20) {
      const y = FLOOR_Y - 90 - Math.sin((x + off * 0.6) * 0.011) * 42 - Math.sin((x + off * 0.6) * 0.004) * 26;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, FLOOR_Y); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "rgba(52,96,110,.7)";
    ctx.beginPath();
    ctx.moveTo(0, FLOOR_Y);
    for (let x = -40; x <= W + 40; x += 16) {
      const y = FLOOR_Y - 44 - Math.sin((x + off) * 0.02) * 26;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, FLOOR_Y); ctx.closePath(); ctx.fill();
  }

  function cloud(x, y, s, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y + 5 * s, 15 * s, 0, Math.PI * 2);
    ctx.arc(x - 22 * s, y + 6 * s, 13 * s, 0, Math.PI * 2);
    ctx.arc(x + 6 * s, y - 12 * s, 14 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPipes() {
    for (const p of G.pipes) {
      const topH = p.gapY - GAP / 2;
      const botY = p.gapY + GAP / 2;
      drawPipe(p.x, 0, PIPE_W, topH, true);
      drawPipe(p.x, botY, PIPE_W, FLOOR_Y - botY, false);
    }
  }

  function drawPipe(x, y, w, h, isTop) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#3f8f4a");
    g.addColorStop(0.28, "#79c96f");
    g.addColorStop(0.62, "#4ea356");
    g.addColorStop(1, "#2c6b38");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = "rgba(24,60,32,.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y - 2, w - 3, h + 4);

    // cap
    const capH = 26, capW = w + 12, capX = x - 6;
    const capY = isTop ? y + h - capH : y;
    const cg = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    cg.addColorStop(0, "#4a9c53");
    cg.addColorStop(0.3, "#8ada7c");
    cg.addColorStop(0.65, "#57ad5c");
    cg.addColorStop(1, "#2f7339");
    ctx.fillStyle = cg;
    roundRect(capX, capY, capW, capH, 6);
    ctx.fill();
    ctx.strokeStyle = "rgba(24,60,32,.9)";
    ctx.lineWidth = 3;
    ctx.stroke();
    // highlight
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.fillRect(capX + 8, capY + 5, 6, capH - 10);
    ctx.fillRect(x + 10, y + (isTop ? 6 : capH + 6), 6, Math.max(0, h - capH - 16));
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
    g.addColorStop(0, "#d9c98d");
    g.addColorStop(0.14, "#c9b678");
    g.addColorStop(1, "#a89156");
    ctx.fillStyle = g;
    ctx.fillRect(0, FLOOR_Y, W, GROUND_H);

    // grass edge
    ctx.fillStyle = "#7fbb59";
    ctx.fillRect(0, FLOOR_Y, W, 12);
    ctx.fillStyle = "#5e9b3f";
    for (let x = -G.groundOff; x < W + 28; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, FLOOR_Y + 12);
      ctx.lineTo(x + 14, FLOOR_Y + 12);
      ctx.lineTo(x + 7, FLOOR_Y + 20);
      ctx.closePath();
      ctx.fill();
    }
    // stripes
    ctx.fillStyle = "rgba(120,102,58,.22)";
    for (let x = -G.groundOff * 1.4; x < W + 40; x += 40) {
      ctx.fillRect(x, FLOOR_Y + 24, 20, GROUND_H - 24);
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // shadow
    ctx.fillStyle = "rgba(0,0,0,.14)";
    ctx.beginPath(); ctx.ellipse(0, 16, 13, 5, 0, 0, Math.PI * 2); ctx.fill();

    // body
    const bg = ctx.createLinearGradient(-14, -14, 14, 14);
    bg.addColorStop(0, "#ffe27a");
    bg.addColorStop(0.5, "#ffc94a");
    bg.addColorStop(1, "#f0a22c");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(140,84,20,.55)";
    ctx.lineWidth = 2; ctx.stroke();

    // belly
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.ellipse(-2, 5, 9, 6, 0, 0, Math.PI * 2); ctx.fill();

    // wing (flips with the flap)
    const wa = -0.5 + bird.wing * 0.9;
    ctx.save();
    ctx.translate(-3, 1);
    ctx.rotate(wa);
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "rgba(140,84,20,.5)";
    ctx.beginPath(); ctx.ellipse(-2, 0, 9, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(7, -5, 5.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#20242c";
    ctx.beginPath(); ctx.arc(8.6, -5, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(9.6, -6.2, 0.9, 0, Math.PI * 2); ctx.fill();

    // beak
    ctx.fillStyle = "#ff8a3d";
    ctx.beginPath();
    ctx.moveTo(13, -1); ctx.lineTo(23, 2); ctx.lineTo(13, 5.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(170,70,20,.6)"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of G.parts) {
      const a = Math.max(0, p.life / p.max);
      ctx.fillStyle = "rgba(" + p.c + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + a * 0.6), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHUD() {
    if (G.state === "play" || G.state === "over") {
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "800 68px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(20,32,48,.55)";
      ctx.strokeText(String(G.score), W / 2, 118);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(G.score), W / 2, 118);
      ctx.restore();
    }
  }

  function medal(score) {
    if (score >= 40) return { c: "#e5e4e2", n: "PLATINUM" };
    if (score >= 25) return { c: "#ffd257", n: "GOLD" };
    if (score >= 12) return { c: "#cfd6dd", n: "SILVER" };
    if (score >= 5) return { c: "#d09a5c", n: "BRONZE" };
    return null;
  }

  function drawReady() {
    ctx.save();
    ctx.textAlign = "center";

    // title
    ctx.font = "900 52px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.lineWidth = 12;
    ctx.strokeStyle = "rgba(18,34,52,.6)";
    ctx.strokeText("SW", W / 2, 168);
    const tg = ctx.createLinearGradient(0, 120, 0, 180);
    tg.addColorStop(0, "#ffffff");
    tg.addColorStop(1, "#ffd257");
    ctx.fillStyle = tg;
    ctx.fillText("SW", W / 2, 168);

    ctx.font = "700 17px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText("BIRDS FLIP", W / 2, 198);

    // tap prompt
    const pulse = 0.5 + 0.5 * Math.sin(G.t * 3.4);
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    ctx.font = "700 20px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("TAP TO FLAP", W / 2, FLOOR_Y - 116);
    ctx.globalAlpha = 1;

    if (G.best > 0) {
      ctx.font = "700 16px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.fillText("BEST  " + G.best, W / 2, 232);
    }
    ctx.restore();
  }

  function drawOver() {
    ctx.save();
    const t = Math.min(1, (G.t - G.overAt) / 0.28);
    const ease = 1 - Math.pow(1 - t, 3);
    ctx.globalAlpha = ease;
    ctx.translate(0, (1 - ease) * 40);

    const cw = 300, ch = 232, cx = (W - cw) / 2, cy = 210;
    ctx.fillStyle = "rgba(12,26,40,.78)";
    roundRect(cx, cy, cw, ch, 22); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 2; ctx.stroke();

    ctx.textAlign = "center";
    ctx.font = "900 30px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "#ffd257";
    ctx.fillText("GAME OVER", W / 2, cy + 52);

    // medal
    const m = medal(G.score);
    const mx = cx + 62, my = cy + 128;
    if (m) {
      const mg = ctx.createRadialGradient(mx - 6, my - 6, 3, mx, my, 30);
      mg.addColorStop(0, "#ffffff");
      mg.addColorStop(1, m.c);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "rgba(30,40,55,.85)";
      ctx.font = "800 9px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.fillText(m.n, mx, my + 42);
    } else {
      ctx.strokeStyle = "rgba(255,255,255,.2)";
      ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,255,255,.62)";
    ctx.font = "700 13px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText("SCORE", cx + cw - 40, cy + 104);
    ctx.fillText("BEST", cx + cw - 40, cy + 158);

    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 34px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText(String(G.score), cx + 118, cy + 112);
    ctx.fillStyle = "#ffd257";
    ctx.font = "900 26px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText(String(G.best), cx + 118, cy + 166);

    ctx.textAlign = "center";
    const pulse = 0.5 + 0.5 * Math.sin(G.t * 4);
    ctx.globalAlpha = ease * (0.55 + pulse * 0.45);
    ctx.fillStyle = "#ffffff";
    ctx.font = "800 15px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText("TAP TO PLAY AGAIN", W / 2, cy + ch + 34);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (G.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }
    drawSky();
    for (const c of G.clouds) cloud(c.x, c.y, c.s, c.a);
    drawPipes();
    drawGround();
    drawParticles();
    drawBird();
    ctx.restore();

    if (G.flash > 0.02) {
      ctx.fillStyle = "rgba(255,255,255," + (G.flash * 0.22).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();
    if (G.state === "ready") drawReady();
    if (G.state === "over") drawOver();
  }

  // ---------------------------------------------------------------- loop
  let prev = performance.now();
  function frame(now) {
    let dt = (now - prev) / 1000;
    prev = now;
    if (dt > 0.05) dt = 0.05;   // clamp after tab switches
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
