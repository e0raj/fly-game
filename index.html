<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:description" content="A tiny full-screen browser game. Tap to lift, glide through the pipes." />

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230d1b2a'/><path d='M12 36c9-13 24-17 40-11-5 12-17 21-30 21z' fill='%23ffd257'/></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0d1b2a; position: fixed; inset: 0;
    overscroll-behavior: none; touch-action: none;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas#game { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .ui {
    position: absolute; top: 0; right: 0; z-index: 5; display: flex; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 14px) 0 0;
  }
  .ui.left {
    right: auto; left: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 0 calc(env(safe-area-inset-left, 0px) + 14px);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 16px 0 13px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(12,24,38,.42);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 700; letter-spacing: .01em;
    transition: background .2s ease, transform .12s ease, border-color .2s ease;
  }
  .pill:hover { background: rgba(12,24,38,.62); border-color: rgba(255,255,255,.34); }
  .pill:active { transform: scale(.95); }
  .pill svg { width: 20px; height: 20px; display: block; }
  @media (max-width: 340px) {
    .pill { padding: 0 12px 0 10px; font-size: 13px; gap: 6px; }
  }
  .btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(12, 24, 38, .42);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: transform .12s ease, background .2s ease;
  }
  .btn:hover { background: rgba(12, 24, 38, .62); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 20px; height: 20px; display: block; }
  .btn .off { display: none; }
  .btn.muted .on { display: none; }
  .btn.muted .off { display: block; }

  .modebtn {
    height: 44px; padding: 0 15px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(12,24,38,.42);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff; font: 800 11px/1 ui-rounded, "Segoe UI", system-ui, sans-serif;
    letter-spacing: .1em; cursor: pointer;
    transition: transform .12s ease, background .2s ease;
  }
  .modebtn:hover { background: rgba(12,24,38,.62); }
  .modebtn:active { transform: scale(.94); }

  #shareBtn {
    position: absolute; z-index: 7; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
    transform: translateX(-50%) translateY(10px);
    opacity: 0; pointer-events: none;
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,.28);
    background: linear-gradient(135deg, rgba(255,214,87,.95), rgba(255,150,60,.95));
    color: #2a1a05; font: 800 13px/1 ui-rounded, "Segoe UI", system-ui, sans-serif;
    letter-spacing: .04em; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,170,60,.28);
    transition: opacity .25s ease, transform .25s ease;
  }
  #shareBtn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #shareBtn:active { transform: translateX(-50%) scale(.96); }
  #shareBtn svg { width: 16px; height: 16px; display: block; }

  /* character picker */
  #skins {
    position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; gap: 10px; padding: 8px 10px;
    border-radius: 20px;
    background: rgba(10, 24, 40, .42);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s ease, transform .25s ease;
  }
  #skins.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }
  #skins button {
    width: 52px; height: 52px; padding: 0; border: none; border-radius: 14px;
    background: rgba(255,255,255,.06); cursor: pointer;
    display: grid; place-items: center;
    transition: background .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  #skins button canvas { width: 46px; height: 46px; display: block; }
  #skins button:active { transform: scale(.94); }
  #skins button.active {
    background: rgba(255, 214, 87, .22);
    box-shadow: inset 0 0 0 2px rgba(255, 214, 87, .85);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui left">
  <a class="pill" href="https://instagram.com/e0raj" target="_blank" rel="noopener noreferrer"
     aria-label="Instagram, @e0raj" title="@e0raj on Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#f9ce34"/>
          <stop offset="35%" stop-color="#f7712f"/>
          <stop offset="65%" stop-color="#ee2a7b"/>
          <stop offset="100%" stop-color="#6228d7"/>
        </linearGradient>
      </defs>
      <g stroke="url(#igGrad)">
        <rect x="2.4" y="2.4" width="19.2" height="19.2" rx="5.6"/>
        <circle cx="12" cy="12" r="4.3"/>
      </g>
      <circle cx="17.5" cy="6.5" r="1.2" fill="url(#igGrad)"/>
    </svg>
    <span>@e0raj</span>
  </a>
</div>

<div class="ui">
  <button class="modebtn" id="modeBtn" aria-label="Difficulty" title="Difficulty">NORMAL</button>
  <button class="btn" id="pauseBtn" aria-label="Pause" title="Pause (P)">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
  </button>
  <button class="btn" id="soundBtn" aria-label="Toggle sound" title="Sound (M)">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
  </button>
  <button class="btn" id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen (F)">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>

<div id="skins"></div>

<button id="shareBtn" aria-label="Share your score">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
  SHARE SCORE
</button>

<script>
(() => {
  "use strict";

  /* ============================================================
     Bird Flip — one file, full screen, fixed-timestep physics,
     and four switchable characters that all fly on the same rules.

     World: virtual space 720 units tall. Width follows the viewport
     aspect ratio, so the canvas always fills the screen edge to edge.
     Physics runs at a fixed 240 Hz, rendering once per frame.
     ============================================================ */

  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d", { alpha: false });

  const VH = 720;
  let VW = 420;
  let scale = 1;
  const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

  const GROUND_H = 108;
  let FLOOR_Y = VH - GROUND_H;

  /* ---------------------------------------------------------- tuning */
  const GRAVITY    = 640;    // light gravity: the character glides, it does not plummet
  const FLAP       = -305;   // a gentle lift, so a few taps keep you up
  const MAX_FALL   = 330;    // slow terminal sink — you always have time to react
  const PIPE_W     = 78;
  let   GAP        = 186;
  const SPACING    = 276;
  let   BASE_SPEED = 205;
  let   MAX_SPEED  = 320;
  const BIRD_R     = 15;

  const MODES = [
    { name: "CHILL",  gap: 238, base: 168, max: 250 },
    { name: "NORMAL", gap: 186, base: 205, max: 320 },
    { name: "INSANE", gap: 146, base: 242, max: 385 },
  ];

  const REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------------------------------------------------------- characters
     Every character flies with identical physics — only the drawing,
     the tilt and the trail colour change. */
  const SKINS = [
    { id: "bird",   label: "BIRD",   rotMul: 1.00, bob: 1.0, trail: "255,255,255" },
    { id: "rocket", label: "ROCKET", rotMul: 0.85, bob: 0.4, trail: "220,226,232" },
    { id: "plane",  label: "PLANE",  rotMul: 1.15, bob: 0.9, trail: "255,255,255" },
    { id: "auto",   label: "AUTO",   rotMul: 0.45, bob: 0.3, trail: "206,182,140" },
  ];

  /* ---------------------------------------------------------- state */
  const bird = {
    x: 130,
    y: VH * 0.44,
    vy: 0,
    rot: 0,
    wingPhase: 0,
    wingAmp: 1,
    boost: 0,
    squash: 0,
    blink: 0,
    blinkTimer: 2.6,
    tail: 0,
  };

  const G = {
    state: "ready",
    t: 0,
    score: 0,
    best: Number(localStorage.getItem("birdflip_best") || 0) | 0,
    skin: 0,
    pipes: [],
    parts: [],
    clouds: [],
    farBirds: [],
    speed: BASE_SPEED,
    scroll: 0,
    shake: 0,
    flash: 0,
    overAt: 0,
    newBest: false,
    hudScore: 0,
    scorePop: 0,
    ripples: [],
    popups: [],
    paused: false,
    mode: 1,
    top: [],
    perfects: 0,
  };

  try {
    const saved = localStorage.getItem("birdflip_skin");
    const idx = SKINS.findIndex((s) => s.id === saved);
    if (idx >= 0) G.skin = idx;
    const rawMode = localStorage.getItem("fly_mode");
    if (rawMode !== null) {
      const m = Number(rawMode);
      if (m >= 0 && m < MODES.length) G.mode = m;
    }
    const top = JSON.parse(localStorage.getItem("fly_top5") || "[]");
    if (Array.isArray(top)) G.top = top.filter((e) => e && typeof e.s === "number").slice(0, 5);
  } catch (e) {}

  function applyMode() {
    const m = MODES[G.mode] || MODES[1];
    GAP = m.gap;
    BASE_SPEED = m.base;
    MAX_SPEED = m.max;
    const btn = document.getElementById("modeBtn");
    if (btn) btn.textContent = m.name;
  }

  function buzz(pattern) {
    try {
      if (navigator.vibrate && !REDUCE) navigator.vibrate(pattern);
    } catch (e) {}
  }

  /* ---------------------------------------------------------- resize */
  function resize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    scale = h / VH;
    VW = w / scale;
    FLOOR_Y = VH - GROUND_H;

    cvs.width = Math.round(w * DPR);
    cvs.height = Math.round(h * DPR);
    ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    bird.x = Math.max(108, Math.min(VW * 0.25, 290));
    makeScenery();
  }

  /* ---------------------------------------------------------- audio */
  let ac = null, master = null, NOISE = null, muted = false;
  try { muted = localStorage.getItem("birdflip_muted") === "1"; } catch (e) {}

  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.85;
    master.connect(ac.destination);

    const len = Math.floor(ac.sampleRate * 0.6);
    NOISE = ac.createBuffer(1, len, ac.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  function env(node, t, attack, decay, peak) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + attack);
    node.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }

  function sfxFlap() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = NOISE;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 1.0;
    bp.frequency.setValueAtTime(1600, t);
    bp.frequency.exponentialRampToValueAtTime(560, t + 0.19);
    const g = ac.createGain();
    env(g, t, 0.012, 0.16, 0.085);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 0.22);

    const o = ac.createOscillator(), og = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(225, t + 0.15);
    env(og, t, 0.008, 0.14, 0.04);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 0.19);
  }

  function sfxScore(streak) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const base = 880 * Math.pow(2, Math.min(streak, 8) / 24);
    [1, 1.5].forEach((mul, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.value = base * mul;
      env(g, t + i * 0.045, 0.006, 0.26, i ? 0.05 : 0.08);
      o.connect(g).connect(master);
      o.start(t + i * 0.045); o.stop(t + 0.4);
    });
  }

  function sfxHit() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(210, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.34);
    env(g, t, 0.006, 0.33, 0.17);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.44);

    const src = ac.createBufferSource(); src.buffer = NOISE;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300;
    const ng = ac.createGain(); env(ng, t, 0.004, 0.2, 0.11);
    src.connect(lp).connect(ng).connect(master);
    src.start(t); src.stop(t + 0.28);
  }

  function sfxFall() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(540, t);
    o.frequency.exponentialRampToValueAtTime(115, t + 0.6);
    env(g, t, 0.02, 0.58, 0.045);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.68);
  }

  function sfxBest() {
    if (!ac || muted) return;
    const t0 = ac.currentTime;
    [0, 4, 7, 12].forEach((semi, i) => {
      const t = t0 + i * 0.09;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle";
      o.frequency.value = 523.25 * Math.pow(2, semi / 12);
      env(g, t, 0.01, 0.3, 0.065);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.42);
    });
  }

  // sparkle for threading a pipe dead centre
  function sfxPerfect() {
    if (!ac || muted) return;
    const t0 = ac.currentTime;
    [0, 7, 12].forEach((semi, i) => {
      const t = t0 + i * 0.055;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.value = 1174.66 * Math.pow(2, semi / 12);
      env(g, t, 0.005, 0.22, 0.055);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + 0.32);
    });
  }

  // short click for the character picker
  function sfxTick() {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square";
    o.frequency.value = 760;
    env(g, t, 0.004, 0.06, 0.035);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.09);
  }

  /* ---------------------------------------------------------- scenery */
  function makeScenery() {
    G.clouds = [];
    const n = Math.round(VW / 135) + 4;
    for (let i = 0; i < n; i++) {
      G.clouds.push({
        x: Math.random() * VW,
        y: 50 + Math.random() * 320,
        s: 0.6 + Math.random() * 1.0,
        v: 4 + Math.random() * 9,
        a: 0.26 + Math.random() * 0.4,
      });
    }
    G.farBirds = [];
    for (let i = 0; i < 3; i++) {
      G.farBirds.push({
        x: Math.random() * VW,
        y: 90 + Math.random() * 150,
        s: 0.5 + Math.random() * 0.6,
        v: 12 + Math.random() * 14,
        ph: Math.random() * 6.28,
      });
    }
    if (!G.stars || !G.stars.length) {
      G.stars = [];
      for (let i = 0; i < 70; i++) {
        G.stars.push({
          x: Math.random() * Math.max(VW, 400),
          y: 20 + Math.random() * 380,
          r: 0.6 + Math.random() * 1.5,
          b: 0.35 + Math.random() * 0.65,
          ph: Math.random() * 6.28,
        });
      }
    }
  }

  /* ---------------------------------------------------------- gameplay */
  function spawnPipe(x) {
    const margin = 74;
    const min = margin + GAP / 2;
    const max = FLOOR_Y - margin - GAP / 2;
    G.pipes.push({ x, gapY: min + Math.random() * (max - min), passed: false, seed: Math.random() });
  }

  function reset() {
    bird.y = VH * 0.44;
    bird.vy = 0;
    bird.rot = 0;
    bird.boost = 0;
    bird.squash = 0;
    G.score = 0; G.hudScore = 0; G.scorePop = 0;
    G.pipes = []; G.parts = []; G.ripples = []; G.popups = [];
    G.perfects = 0;
    G.speed = BASE_SPEED;
    G.scroll = 0;
    G.shake = 0; G.flash = 0;
    G.t = 0; G.newBest = false;
    const n = Math.ceil(VW / SPACING) + 2;
    for (let i = 0; i < n; i++) spawnPipe(VW + 150 + i * SPACING);
  }

  function flap() {
    initAudio();
    if (G.state === "ready") {
      G.state = "play";
      reset();
      bird.vy = FLAP;
    } else if (G.state === "play") {
      bird.vy = FLAP;
    } else if (G.state === "over" && G.t - G.overAt > 0.5) {
      G.state = "ready";
      reset();
      return;
    }
    if (G.state === "play") {
      bird.boost = 1;
      bird.squash = 1;
      for (let i = 0; i < 4; i++) puff();
      sfxFlap();
    }
  }

  function puff() {
    const skin = SKINS[G.skin];
    G.parts.push({
      kind: "puff",
      x: bird.x - 13 + Math.random() * 6,
      y: bird.y + 9 + Math.random() * 8,
      vx: -60 - Math.random() * 80,
      vy: (Math.random() - 0.5) * 60,
      life: 0.5, max: 0.5,
      r: 2.5 + Math.random() * 3.5,
      col: skin.trail,
      rot: 0, spin: 0,
    });
  }

  function burst(x, y) {
    const skin = SKINS[G.skin];
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 70 + Math.random() * 290;
      G.parts.push({
        kind: "feather", x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        life: 1.1, max: 1.1,
        r: 2.5 + Math.random() * 3.5,
        col: skin.trail,
        rot: Math.random() * 6.28,
        spin: (Math.random() - 0.5) * 9,
      });
    }
  }

  function sparks(x, y) {
    for (let i = 0; i < 9; i++) {
      G.parts.push({
        kind: "spark", x, y,
        vx: 25 + Math.random() * 110,
        vy: (Math.random() - 0.5) * 180,
        life: 0.55, max: 0.55,
        r: 1.6 + Math.random() * 2.4,
        rot: 0, spin: 0,
      });
    }
  }

  function die() {
    if (G.state !== "play") return;
    G.state = "over";
    G.overAt = G.t;
    G.shake = REDUCE ? 0 : 16;
    G.flash = 1;
    sfxHit();
    buzz([18, 45, 26]);
    setTimeout(sfxFall, 120);
    burst(bird.x, bird.y);

    if (G.score > G.best) {
      G.best = G.score;
      G.newBest = true;
      try { localStorage.setItem("birdflip_best", String(G.best)); } catch (e) {}
      setTimeout(sfxBest, 420);
      if (!REDUCE) setTimeout(confetti, 120);
    }

    // keep a local top five
    G.top.push({ s: G.score, d: Date.now() });
    G.top.sort((a, b) => b.s - a.s);
    G.top = G.top.slice(0, 5);
    try { localStorage.setItem("fly_top5", JSON.stringify(G.top)); } catch (e) {}
  }

  function confetti() {
    const cols = ["#ffd257", "#ff8a3d", "#ff5f7e", "#5fd0ff", "#8ce07a", "#c08bff"];
    for (let i = 0; i < 64; i++) {
      G.parts.push({
        kind: "confetti",
        x: Math.random() * VW,
        y: -20 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 90,
        vy: 50 + Math.random() * 150,
        life: 2.6, max: 2.6,
        r: 3 + Math.random() * 3,
        col: cols[(Math.random() * cols.length) | 0],
        rot: Math.random() * 6.28,
        spin: (Math.random() - 0.5) * 10,
      });
    }
  }

  function popup(x, y, text, col) {
    G.popups.push({ x, y, text, col: col || "#ffe9a3", life: 0.95, max: 0.95 });
  }

  function circleHitsRect(cx, cy, cr, rx, ry, rw, rh) {
    if (rh <= 0) return false;
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  /* ---------------------------------------------------------- input */
  function addRipple(e) {
    const rect = cvs.getBoundingClientRect ? cvs.getBoundingClientRect() : null;
    const rw = rect && rect.width ? rect.width : window.innerWidth;
    const rh = rect && rect.height ? rect.height : window.innerHeight;
    const px = e && typeof e.clientX === "number" ? (e.clientX - (rect ? rect.left : 0)) * (VW / rw) : bird.x;
    const py = e && typeof e.clientY === "number" ? (e.clientY - (rect ? rect.top : 0)) * (VH / rh) : bird.y;
    G.ripples.push({ x: px, y: py, life: 0.5, max: 0.5 });
  }

  /* Tap to fly, horizontal swipe to change character.
     During a round a press lifts immediately; on the title and game-over
     screens we wait for the release so a swipe is never mistaken for a tap. */
  const press = { active: false, x: 0, y: 0 };

  function onDown(e) {
    if (e && e.cancelable) e.preventDefault();
    press.active = true;
    press.x = typeof e.clientX === "number" ? e.clientX : 0;
    press.y = typeof e.clientY === "number" ? e.clientY : 0;
    if (G.paused) { G.paused = false; return; }
    if (G.state === "play") {
      flap();
      addRipple(e);
    }
  }

  function onUp(e) {
    if (!press.active) return;
    press.active = false;
    const x = typeof e.clientX === "number" ? e.clientX : press.x;
    const y = typeof e.clientY === "number" ? e.clientY : press.y;
    const dx = x - press.x;
    const dy = y - press.y;

    if (G.state !== "play") {
      const swiped = Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.3;
      if (swiped) {
        cycleSkin(dx < 0 ? 1 : -1);
        return;
      }
      if (Math.abs(dx) < 42 && Math.abs(dy) < 42) {
        flap();
        addRipple(e);
      }
    }
  }

  function onCancel() { press.active = false; }

  cvs.addEventListener("pointerdown", onDown, { passive: false });
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); flap(); }
    else if (e.code === "KeyM") { toggleSound(); }
    else if (e.code === "KeyF") { toggleFullscreen(); }
    else if (e.code === "KeyP") { togglePause(); }
    else if (e.code === "KeyR") { G.paused = false; G.state = "ready"; reset(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); cycleSkin(1); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); cycleSkin(-1); }
    else if (e.code === "Digit1" || e.code === "Digit2" || e.code === "Digit3" || e.code === "Digit4") {
      selectSkin(Number(e.code.slice(5)) - 1);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && G.state === "play") { G.state = "ready"; reset(); }
  });

  /* ---------------------------------------------------------- buttons */
  const soundBtn = document.getElementById("soundBtn");
  const fsBtn = document.getElementById("fsBtn");
  const skinsBar = document.getElementById("skins");

  function toggleSound() {
    muted = !muted;
    soundBtn.classList.toggle("muted", muted);
    try { localStorage.setItem("birdflip_muted", muted ? "1" : "0"); } catch (e) {}
    if (!muted) { initAudio(); sfxScore(0); }
  }
  soundBtn.classList.toggle("muted", muted);
  soundBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleSound(); });

  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) { const p = fn.call(el, { navigationUI: "hide" }); if (p && p.catch) p.catch(() => {}); }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
    }
  }
  fsBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });

  const modeBtn = document.getElementById("modeBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const shareBtn = document.getElementById("shareBtn");

  modeBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    G.mode = (G.mode + 1) % MODES.length;
    applyMode();
    try { localStorage.setItem("fly_mode", String(G.mode)); } catch (err) {}
    if (G.state !== "play") { G.state = "ready"; reset(); }
    initAudio();
    sfxTick();
  });

  function togglePause() {
    if (G.state !== "play") return;
    G.paused = !G.paused;
    press.active = false;
    if (G.paused) initAudio();
  }
  pauseBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });

  function syncShareVisibility() {
    if (shareBtn) shareBtn.classList.toggle("show", G.state === "over");
  }

  /* Draw a 1080x1350 score card, then share it (or download it). */
  function buildShareCard() {
    const CW = 1080, CH = 1350;
    const c = document.createElement("canvas");
    c.width = CW; c.height = CH;
    const g = c.getContext("2d");

    const bg = g.createLinearGradient(0, 0, 0, CH);
    bg.addColorStop(0, "#123a5c");
    bg.addColorStop(0.5, "#2f7595");
    bg.addColorStop(1, "#f0d9a0");
    g.fillStyle = bg; g.fillRect(0, 0, CW, CH);

    const halo = g.createRadialGradient(760, 300, 10, 760, 300, 340);
    halo.addColorStop(0, "rgba(255,250,220,.95)");
    halo.addColorStop(1, "rgba(255,240,190,0)");
    g.fillStyle = halo; g.beginPath(); g.arc(760, 300, 340, 0, Math.PI * 2); g.fill();

    g.textAlign = "center";
    g.textBaseline = "middle";

    g.fillStyle = "rgba(10,30,50,.35)";
    g.font = "900 128px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillText("FLY", CW / 2 + 5, 175);
    g.fillStyle = "#ffffff";
    g.fillText("FLY", CW / 2, 170);

    g.save();
    g.translate(CW / 2, 430);
    g.scale(6.4, 6.4);
    drawSkin(g, SKINS[G.skin].id, { phase: 1.1, boost: 0, blink: 0, vy: 0, tail: 0 });
    g.restore();

    g.font = "800 42px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillStyle = "rgba(255,255,255,.8)";
    g.fillText("SCORE", CW / 2, 640);

    g.font = "900 250px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillStyle = "#ffffff";
    g.fillText(String(G.score), CW / 2, 800);

    g.font = "800 46px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillStyle = "#ffe9a3";
    g.fillText("BEST " + G.best, CW / 2, 960);

    g.fillStyle = "rgba(255,255,255,.22)";
    g.fillRect(CW / 2 - 200, 1030, 400, 2);

    g.font = "800 52px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillStyle = "#ffffff";
    g.fillText("@e0raj", CW / 2, 1120);

    g.font = "600 30px ui-rounded, Segoe UI, system-ui, sans-serif";
    g.fillStyle = "rgba(255,255,255,.6)";
    g.fillText("fly-game", CW / 2, 1178);

    return c;
  }

  function shareScore() {
    initAudio();
    sfxScore(0);
    const canvas = buildShareCard();
    const save = (blob) => {
      if (!blob) return;
      try {
        const file = typeof File === "function" ? new File([blob], "fly-score.png", { type: "image/png" }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "Fly", text: "I scored " + G.score + " in Fly" })
            .catch(() => {});
          return;
        }
      } catch (err) {}
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "fly-score-" + G.score + ".png";
      if (document.body) document.body.appendChild(a);
      a.click();
      if (a.remove) a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };
    if (canvas.toBlob) canvas.toBlob(save, "image/png");
  }

  shareBtn.addEventListener("click", (e) => { e.stopPropagation(); shareScore(); });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 150));

  /* ---------------------------------------------------------- picker */
  const skinButtons = [];

  function buildPicker() {
    SKINS.forEach((skin, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", skin.label);
      b.title = skin.label;
      const thumb = document.createElement("canvas");
      thumb.width = 92;
      thumb.height = 92;
      b.appendChild(thumb);
      b.addEventListener("pointerdown", (e) => e.stopPropagation());
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        selectSkin(i);
      });
      skinsBar.appendChild(b);
      skinButtons.push({ btn: b, canvas: thumb });
      paintThumb(thumb, skin.id);
    });
    updatePickerActive();
  }

  function paintThumb(canvas, id) {
    const g = canvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.save();
    g.translate(canvas.width / 2, canvas.height / 2);
    g.scale(1.25, 1.25);
    drawSkin(g, id, { phase: 1.1, boost: 0, blink: 0, vy: 0, tail: 0 });
    g.restore();
  }

  function selectSkin(i) {
    if (i < 0 || i >= SKINS.length || i === G.skin) return;
    G.skin = i;
    try { localStorage.setItem("birdflip_skin", SKINS[i].id); } catch (e) {}
    updatePickerActive();
    initAudio();
    sfxTick();
    // a little pop so the change is felt
    bird.boost = 0.6;
  }

  function updatePickerActive() {
    skinButtons.forEach((s, i) => s.btn.classList.toggle("active", i === G.skin));
  }

  function cycleSkin(dir) {
    const n = SKINS.length;
    selectSkin(((G.skin + dir) % n + n) % n);
  }

  function syncPickerVisibility() {
    const show = G.state === "ready" || G.state === "over";
    skinsBar.classList.toggle("hidden", !show);
  }

  buildPicker();

  /* ---------------------------------------------------------- update */
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function update(dt) {
    G.t += dt;
    G.shake *= Math.pow(0.0015, dt);
    G.flash = Math.max(0, G.flash - dt * 3.4);
    G.scorePop = Math.max(0, G.scorePop - dt * 3.2);
    for (let i = G.ripples.length - 1; i >= 0; i--) {
      G.ripples[i].life -= dt;
      if (G.ripples[i].life <= 0) G.ripples.splice(i, 1);
    }
    for (let i = G.popups.length - 1; i >= 0; i--) {
      const q = G.popups[i];
      q.life -= dt;
      q.y -= 44 * dt;
      if (q.life <= 0) G.popups.splice(i, 1);
    }

    const drift = G.state === "play" ? G.speed * 0.1 : 8;
    for (const c of G.clouds) {
      c.x -= (c.v + drift) * dt;
      if (c.x < -150 * c.s) {
        c.x = VW + 130;
        c.y = 50 + Math.random() * 320;
        c.s = 0.6 + Math.random() * 1.0;
        c.a = 0.26 + Math.random() * 0.4;
      }
    }
    for (const b of G.farBirds) {
      b.x -= (b.v + drift * 0.6) * dt;
      b.y += Math.sin(G.t * 1.7 + b.ph) * 6 * dt;
      if (b.x < -40) { b.x = VW + 40; b.y = 90 + Math.random() * 150; }
    }

    for (let i = G.parts.length - 1; i >= 0; i--) {
      const p = G.parts[i];
      p.life -= dt;
      if (p.life <= 0) { G.parts.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === "feather") { p.vy += 520 * dt; p.vx *= 0.985; p.rot += p.spin * dt; }
      else if (p.kind === "puff") { p.vy += 220 * dt; p.vx *= 0.97; }
      else if (p.kind === "confetti") { p.vy += 190 * dt; p.vx *= 0.995; p.rot += p.spin * dt; }
      else { p.vy += 640 * dt; }
    }

    // character animation, always running
    bird.blinkTimer -= dt;
    if (bird.blinkTimer <= 0) { bird.blink = 0.13; bird.blinkTimer = 2.2 + Math.random() * 3.4; }
    if (bird.blink > 0) bird.blink -= dt;

    bird.boost = Math.max(0, bird.boost - dt * 3.4);
    const beat = (G.state === "play" ? 5.6 : 3.1) + bird.boost * 7.0;
    bird.wingPhase += dt * Math.PI * 2 * beat;
    if (bird.wingPhase > Math.PI * 2) bird.wingPhase -= Math.PI * 2;
    bird.wingAmp = lerp(bird.wingAmp, 0.82 + bird.boost * 0.45, Math.min(1, dt * 14));
    bird.squash = Math.max(0, bird.squash - dt * 5.5);

    if (G.state === "ready") {
      bird.y = VH * 0.44 + Math.sin(G.t * 2.1) * 9;
      bird.rot = lerp(bird.rot, Math.sin(G.t * 2.1) * 0.1, Math.min(1, dt * 8));
      bird.tail = Math.sin(G.t * 2.6) * 0.1;
      return;
    }

    if (G.state === "over") {
      bird.vy = Math.min(bird.vy + GRAVITY * 2.6 * dt, 920);
      bird.y += bird.vy * dt;
      if (bird.y > FLOOR_Y - BIRD_R) {
        bird.y = FLOOR_Y - BIRD_R;
        if (bird.vy > 120) bird.vy *= -0.26; else bird.vy = 0;
      }
      bird.rot = Math.min(Math.PI / 2, bird.rot + dt * 4.2);
      return;
    }

    // flight
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;

    if (bird.vy < 0) {
      bird.rot = lerp(bird.rot, -0.40, Math.min(1, dt * 14));
    } else {
      bird.rot = Math.min(0.95, bird.rot + dt * (0.9 + (bird.vy / MAX_FALL) * 1.6));
    }
    bird.tail = clamp(-bird.vy * 0.0004, -0.12, 0.2) + Math.sin(G.t * 7) * 0.05;

    if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = Math.max(bird.vy, 0); }
    if (bird.y + BIRD_R >= FLOOR_Y) { bird.y = FLOOR_Y - BIRD_R; die(); return; }

    const targetSpeed = Math.min(MAX_SPEED, BASE_SPEED + G.score * 4);
    G.speed = lerp(G.speed, targetSpeed, Math.min(1, dt * 1.6));
    G.scroll += G.speed * dt;

    for (const p of G.pipes) p.x -= G.speed * dt;

    const last = G.pipes[G.pipes.length - 1];
    if (last && last.x < VW - SPACING) spawnPipe(last.x + SPACING);
    while (G.pipes.length && G.pipes[0].x + PIPE_W < -80) G.pipes.shift();

    for (const p of G.pipes) {
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        const centred = Math.abs(bird.y - p.gapY) < 26;
        G.score += centred ? 2 : 1;
        if (centred) {
          G.perfects++;
          popup(bird.x + 34, bird.y - 30, "PERFECT +2", "#ffe9a3");
          sfxPerfect();
        } else {
          sfxScore(G.score);
        }
        G.flash = Math.max(G.flash, 0.14);
        G.scorePop = 1;
        sparks(bird.x + 15, bird.y);
      }
      const topH = p.gapY - GAP / 2;
      const botY = p.gapY + GAP / 2;
      if (circleHitsRect(bird.x, bird.y, BIRD_R - 3, p.x, 0, PIPE_W, topH) ||
          circleHitsRect(bird.x, bird.y, BIRD_R - 3, p.x, botY, PIPE_W, FLOOR_Y - botY)) {
        die();
        return;
      }
    }

    if (G.hudScore < G.score) G.hudScore = Math.min(G.score, G.hudScore + dt * 20);
  }

  /* ---------------------------------------------------------- drawing helpers */
  function roundRect(g, x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  /* day -> dusk -> night, driven by the score */
  let dayP = 0;

  const DAY_COLS   = ["#1e4b73", "#3f83ab", "#79b8c9", "#cfe3cd", "#f3e6bd"];
  const DUSK_COLS  = ["#2a3a63", "#6b4a7a", "#c56b7a", "#f0a06a", "#f7d39a"];
  const NIGHT_COLS = ["#070d1c", "#0d1730", "#1b2748", "#243356", "#2f3f63"];

  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
    const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
    return "rgb(" + Math.round(ar + (br - ar) * t) + "," +
                    Math.round(ag + (bg - ag) * t) + "," +
                    Math.round(ab + (bb - ab) * t) + ")";
  }

  function skyStops(p) {
    const from = p < 0.5 ? DAY_COLS : DUSK_COLS;
    const to   = p < 0.5 ? DUSK_COLS : NIGHT_COLS;
    const t    = p < 0.5 ? p / 0.5 : (p - 0.5) / 0.5;
    return from.map((c, i) => mixHex(c, to[i], t));
  }

  function drawStars() {
    const a = Math.max(0, Math.min(1, (dayP - 0.34) / 0.4));
    if (a <= 0.01) return;
    for (const st of G.stars) {
      const tw = 0.55 + 0.45 * Math.sin(G.t * 2.2 + st.ph);
      ctx.fillStyle = "rgba(255,255,255," + (a * tw * st.b).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSky() {
    const cols = skyStops(dayP);
    const sky = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
    sky.addColorStop(0.00, cols[0]);
    sky.addColorStop(0.28, cols[1]);
    sky.addColorStop(0.58, cols[2]);
    sky.addColorStop(0.82, cols[3]);
    sky.addColorStop(1.00, cols[4]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, FLOOR_Y);

    drawStars();

    // sun sinks and fades out
    const sunFade = Math.max(0, 1 - dayP * 1.35);
    if (sunFade > 0.02) {
      const sx = VW * 0.76, sy = VH * 0.16 + dayP * 210;
      const halo = ctx.createRadialGradient(sx, sy, 4, sx, sy, 190);
      halo.addColorStop(0, "rgba(255,250,224," + (0.95 * sunFade).toFixed(3) + ")");
      halo.addColorStop(0.18, "rgba(255,238,178," + (0.55 * sunFade).toFixed(3) + ")");
      halo.addColorStop(0.55, "rgba(255,226,150," + (0.16 * sunFade).toFixed(3) + ")");
      halo.addColorStop(1, "rgba(255,226,150,0)");
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(sx, sy, 190, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,251,232," + sunFade.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(sx, sy, 38, 0, Math.PI * 2); ctx.fill();
    }

    // moon rises as the sky darkens
    const moonA = Math.max(0, Math.min(1, (dayP - 0.45) / 0.35));
    if (moonA > 0.02) {
      const mx = VW * 0.76, my = VH * 0.16 + (1 - moonA) * 90;
      const mg = ctx.createRadialGradient(mx, my, 4, mx, my, 150);
      mg.addColorStop(0, "rgba(230,240,255," + (0.55 * moonA).toFixed(3) + ")");
      mg.addColorStop(1, "rgba(200,220,255,0)");
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 150, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(248,250,255," + moonA.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(196,208,230," + (moonA * 0.55).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(mx - 9, my - 7, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 7, my + 6, 3.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCloud(x, y, s, a) {
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(0, y - 30 * s, 0, y + 22 * s);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(1, "#dfeaf2");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 24 * s, y + 6 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(x - 25 * s, y + 7 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x + 7 * s, y - 14 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(x - 10 * s, y - 8 * s, 13 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFarBirds() {
    ctx.save();
    ctx.strokeStyle = "rgba(40,74,96,.30)";
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    for (const b of G.farBirds) {
      const f = Math.sin(G.t * 7 + b.ph) * 4 * b.s;
      ctx.beginPath();
      ctx.moveTo(b.x - 8 * b.s, b.y + f);
      ctx.quadraticCurveTo(b.x - 3 * b.s, b.y - 3 * b.s, b.x, b.y);
      ctx.quadraticCurveTo(b.x + 3 * b.s, b.y - 3 * b.s, b.x + 8 * b.s, b.y + f);
      ctx.stroke();
    }
    ctx.restore();
  }

  const HILL_T = 640;

  function ridgeY(x, off, base, a1, k1, a2, k2, a3, k3) {
    const u = ((x + off) / HILL_T) * Math.PI * 2;
    return base - a1 * Math.sin(u * k1) - a2 * Math.sin(u * k2) - a3 * Math.sin(u * k3);
  }

  function drawHills() {
    const off = G.scroll;

    ctx.fillStyle = "rgba(96,140,152,.55)";
    ctx.beginPath();
    ctx.moveTo(-10, FLOOR_Y);
    for (let x = -10; x <= VW + 10; x += 12) {
      ctx.lineTo(x, ridgeY(x, off * 0.22, FLOOR_Y - 146, 58, 1, 26, 3, 12, 5));
    }
    ctx.lineTo(VW + 10, FLOOR_Y);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "rgba(64,110,124,.72)";
    ctx.beginPath();
    ctx.moveTo(-10, FLOOR_Y);
    for (let x = -10; x <= VW + 10; x += 10) {
      ctx.lineTo(x, ridgeY(x, off * 0.46, FLOOR_Y - 68, 30, 2, 14, 5, 6, 9));
    }
    ctx.lineTo(VW + 10, FLOOR_Y);
    ctx.closePath(); ctx.fill();

    const step = 96;
    const s = off * 0.78;
    const startIdx = Math.floor(s / step);
    ctx.fillStyle = "rgba(42,84,72,.85)";
    const base = FLOOR_Y - 22;
    for (let i = -1; i <= VW / step + 2; i++) {
      const wi = startIdx + i;
      const tx = wi * step - s;
      const h = 30 + Math.abs((wi * 37) % 26);
      ctx.beginPath();
      ctx.moveTo(tx, base);
      ctx.quadraticCurveTo(tx + 10, base - h * 0.6, tx + 3, base - h);
      ctx.quadraticCurveTo(tx + 18, base - h * 0.55, tx + 26, base);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPipes() {
    for (const p of G.pipes) {
      const topH = p.gapY - GAP / 2;
      const botY = p.gapY + GAP / 2;
      drawPipe(p.x, 0, topH, true, p.seed);
      drawPipe(p.x, botY, FLOOR_Y - botY, false, p.seed);
    }
  }

  function drawPipe(x, y, h, isTop, seed) {
    if (h <= 0) return;

    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0.00, "#2e6f3c");
    g.addColorStop(0.16, "#4f9b4e");
    g.addColorStop(0.42, "#8ecf72");
    g.addColorStop(0.62, "#5fa955");
    g.addColorStop(0.86, "#37743c");
    g.addColorStop(1.00, "#1f5129");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, PIPE_W, h);

    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fillRect(x + 9, y, 7, h);
    ctx.fillStyle = "rgba(0,0,0,.20)";
    ctx.fillRect(x + PIPE_W - 15, y, 8, h);

    ctx.fillStyle = "rgba(0,0,0,.055)";
    for (let ty = y + 40 + seed * 40; ty < y + h; ty += 74) ctx.fillRect(x, ty, PIPE_W, 3);

    ctx.strokeStyle = "rgba(16,46,24,.9)";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y - 2, PIPE_W - 3, h + 4);

    const capH = 30, capW = PIPE_W + 14, capX = x - 7;
    const capY = isTop ? y + h - capH : y;
    const cg = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    cg.addColorStop(0.00, "#2f7440");
    cg.addColorStop(0.18, "#59a851");
    cg.addColorStop(0.44, "#9ad97c");
    cg.addColorStop(0.66, "#63ae56");
    cg.addColorStop(0.88, "#3a7a3f");
    cg.addColorStop(1.00, "#21562b");
    ctx.fillStyle = cg;
    roundRect(ctx, capX, capY, capW, capH, 7);
    ctx.fill();
    ctx.strokeStyle = "rgba(16,46,24,.95)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    roundRect(ctx, capX + 9, capY + 5, 6, capH - 10, 3);
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = "#000";
    ctx.fillRect(x + PIPE_W, isTop ? y + h - capH : y + capH, 7, isTop ? capH : h - capH);
    ctx.restore();
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, FLOOR_Y, 0, VH);
    g.addColorStop(0, "#e0cd92");
    g.addColorStop(0.10, "#cdb87c");
    g.addColorStop(1, "#9c854e");
    ctx.fillStyle = g;
    ctx.fillRect(0, FLOOR_Y, VW, GROUND_H);

    const gg = ctx.createLinearGradient(0, FLOOR_Y, 0, FLOOR_Y + 18);
    gg.addColorStop(0, "#8fce62");
    gg.addColorStop(1, "#5da341");
    ctx.fillStyle = gg;
    ctx.fillRect(0, FLOOR_Y, VW, 18);

    const bOff = G.scroll % 46;
    ctx.fillStyle = "#4f8f38";
    for (let x = -bOff; x < VW + 46; x += 46) {
      ctx.beginPath();
      ctx.moveTo(x, FLOOR_Y + 18);
      ctx.lineTo(x + 23, FLOOR_Y + 18);
      ctx.lineTo(x + 11, FLOOR_Y + 28);
      ctx.closePath();
      ctx.fill();
    }

    const sOff = (G.scroll * 1.5) % 60;
    ctx.fillStyle = "rgba(120,100,56,.16)";
    for (let x = -sOff; x < VW + 60; x += 60) ctx.fillRect(x, FLOOR_Y + 34, 30, GROUND_H - 34);

    const dOff = (G.scroll * 2.1) % 80;
    ctx.fillStyle = "rgba(255,255,255,.10)";
    for (let x = -dOff; x < VW + 80; x += 80) {
      ctx.beginPath();
      ctx.arc(x + 12, FLOOR_Y + 62, 3.2, 0, Math.PI * 2);
      ctx.arc(x + 44, FLOOR_Y + 84, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(0, FLOOR_Y, VW, 2);
  }

  function drawParticles(layer) {
    for (const p of G.parts) {
      const a = Math.max(0, p.life / p.max);
      if (layer === "back" && p.kind !== "puff") continue;
      if (layer === "front" && p.kind === "puff") continue;

      if (p.kind === "puff") {
        ctx.fillStyle = "rgba(" + (p.col || "255,255,255") + "," + (a * 0.5).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (1.4 - a * 0.5), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === "spark") {
        ctx.fillStyle = "rgba(255,224,132," + a.toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === "confetti") {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, a * 1.8);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = a;
        ctx.fillStyle = a > 0.5 ? "#ffd873" : "#f0a53a";
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 1.9, p.r * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  /* ============================================================
     Characters — every one is drawn around (0,0) facing right,
     roughly 36 units long, so they all sit in the same hitbox.
     ============================================================ */
  function drawSkin(g, id, s) {
    if (id === "rocket") return drawRocket(g, s);
    if (id === "plane") return drawPaperPlane(g, s);
    if (id === "auto") return drawAuto(g, s);
    return drawBirdSkin(g, s);
  }

  /* --- bird ------------------------------------------------------- */
  function drawBirdSkin(g, s) {
    const wingAngle = Math.sin(s.phase) * (0.82 + s.boost * 0.45) - 0.28;

    // back wing
    g.save();
    g.translate(-3, -1);
    g.rotate(wingAngle * 0.8 + 0.3);
    const bw = g.createLinearGradient(-13, -8, 5, 9);
    bw.addColorStop(0, "#d98b23");
    bw.addColorStop(1, "#b46a17");
    g.fillStyle = bw;
    g.beginPath();
    g.moveTo(2, 0);
    g.quadraticCurveTo(-16, -4, -24, 5);
    g.quadraticCurveTo(-14, 9, 2, 6);
    g.closePath();
    g.fill();
    g.restore();

    // tail
    g.save();
    g.translate(-12, 2);
    g.rotate(s.tail || 0);
    g.fillStyle = "#e09a2c";
    g.beginPath();
    g.moveTo(2, -4);
    g.lineTo(-12, -8);
    g.lineTo(-9, -2);
    g.lineTo(-13, 3);
    g.lineTo(2, 5);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(140,80,16,.5)";
    g.lineWidth = 1.3;
    g.stroke();
    g.restore();

    // body
    const bg = g.createLinearGradient(-5, -16, 7, 16);
    bg.addColorStop(0.00, "#fff2b8");
    bg.addColorStop(0.30, "#ffdc72");
    bg.addColorStop(0.62, "#fcc244");
    bg.addColorStop(1.00, "#e0942a");
    g.fillStyle = bg;
    g.beginPath();
    g.ellipse(0, 0, 17, 13.6, 0, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "rgba(150,88,20,.45)";
    g.lineWidth = 1.7;
    g.stroke();

    g.save();
    g.beginPath();
    g.ellipse(0, 0, 17, 13.6, 0, 0, Math.PI * 2);
    g.clip();
    const belly = g.createRadialGradient(2, 8, 2, 2, 8, 14);
    belly.addColorStop(0, "rgba(255,255,255,.62)");
    belly.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = belly;
    g.beginPath();
    g.ellipse(2, 7, 13, 8, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();

    g.strokeStyle = "rgba(170,100,20,.2)";
    g.lineWidth = 1.3;
    g.beginPath(); g.arc(-2, 1, 11, 0.5, 1.9); g.stroke();
    g.beginPath(); g.arc(-1, 4, 8, 0.6, 1.8); g.stroke();

    // head
    g.fillStyle = "#ffe07f";
    g.beginPath(); g.arc(10, -5, 10.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,140,110,.32)";
    g.beginPath(); g.arc(13.5, 0.5, 3.8, 0, Math.PI * 2); g.fill();

    // eye
    const ex = 12.6, ey = -7;
    if (s.blink <= 0) {
      g.fillStyle = "#ffffff";
      g.beginPath(); g.arc(ex, ey, 5.9, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(120,72,14,.35)";
      g.lineWidth = 1.1; g.stroke();

      const look = Math.max(-1, Math.min(1.6, (s.vy || 0) / 2600));
      g.fillStyle = "#20232b";
      g.beginPath(); g.arc(ex + 1.5, ey + look * 1.4, 2.9, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(255,255,255,.92)";
      g.beginPath(); g.arc(ex + 2.6, ey - 1.4 + look * 1.3, 1, 0, Math.PI * 2); g.fill();
    } else {
      g.strokeStyle = "#3a2a14";
      g.lineWidth = 2.1;
      g.lineCap = "round";
      g.beginPath(); g.arc(ex, ey, 5, 0.15, Math.PI - 0.15); g.stroke();
    }

    // beak
    const open = 1.8 + Math.sin(s.phase) * 1.6;
    g.fillStyle = "#ff9330";
    g.beginPath();
    g.moveTo(19, -6);
    g.lineTo(30, -2.4);
    g.lineTo(19, 0.4);
    g.closePath();
    g.fill();
    g.fillStyle = "#e8791f";
    g.beginPath();
    g.moveTo(19, 0.4 + open);
    g.lineTo(27.5, 3.2 + open);
    g.lineTo(19, 4.2 + open);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(150,70,10,.45)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(19, -6); g.lineTo(30, -2.4);
    g.moveTo(19, 4.2 + open); g.lineTo(27.5, 3.2 + open);
    g.stroke();

    // front wing
    g.save();
    g.translate(0, 1);
    g.rotate(wingAngle);
    const fw = g.createLinearGradient(-15, -9, 7, 11);
    fw.addColorStop(0.00, "#ffffff");
    fw.addColorStop(0.45, "#fff4d2");
    fw.addColorStop(1.00, "#ffd67a");
    g.fillStyle = fw;
    g.beginPath();
    g.moveTo(3, -2);
    g.quadraticCurveTo(-13, -11, -25, -3);
    g.quadraticCurveTo(-15, 7, 3, 5.5);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(160,96,18,.5)";
    g.lineWidth = 1.5;
    g.stroke();

    g.strokeStyle = "rgba(180,116,26,.3)";
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(-4, -4.5); g.quadraticCurveTo(-14, -3.6, -20, -1);
    g.moveTo(-4, 0); g.quadraticCurveTo(-13, 1.8, -18, 3.6);
    g.stroke();
    g.restore();
  }

  /* --- rocket ----------------------------------------------------- */
  function drawRocket(g, s) {
    const flick = 0.7 + Math.sin(s.phase * 2.6) * 0.18 + s.boost * 0.55;
    const flameLen = 15 * flick;

    // exhaust flame
    const fg = g.createLinearGradient(-14 - flameLen, 0, -12, 0);
    fg.addColorStop(0, "rgba(255,120,40,0)");
    fg.addColorStop(0.45, "rgba(255,150,50,.85)");
    fg.addColorStop(1, "rgba(255,226,120,1)");
    g.fillStyle = fg;
    g.beginPath();
    g.moveTo(-12, -6);
    g.quadraticCurveTo(-16 - flameLen * 0.6, -1, -12 - flameLen, 0);
    g.quadraticCurveTo(-16 - flameLen * 0.6, 1, -12, 6);
    g.closePath();
    g.fill();

    g.fillStyle = "rgba(255,255,235,.9)";
    g.beginPath();
    g.moveTo(-12, -3);
    g.quadraticCurveTo(-14 - flameLen * 0.4, 0, -12 - flameLen * 0.6, 0);
    g.quadraticCurveTo(-14 - flameLen * 0.4, 0, -12, 3);
    g.closePath();
    g.fill();

    // fins
    g.fillStyle = "#e2574c";
    g.beginPath();
    g.moveTo(-9, -7);
    g.lineTo(-17, -14);
    g.lineTo(-16, -5);
    g.closePath();
    g.fill();
    g.beginPath();
    g.moveTo(-9, 7);
    g.lineTo(-17, 14);
    g.lineTo(-16, 5);
    g.closePath();
    g.fill();

    // body
    const bg = g.createLinearGradient(0, -9, 0, 9);
    bg.addColorStop(0, "#fdfdff");
    bg.addColorStop(0.45, "#dfe4ea");
    bg.addColorStop(1, "#9aa4b1");
    g.fillStyle = bg;
    g.beginPath();
    g.moveTo(12, -8);
    g.lineTo(-10, -8);
    g.quadraticCurveTo(-14, 0, -10, 8);
    g.lineTo(12, 8);
    g.quadraticCurveTo(24, 3, 24, 0);
    g.quadraticCurveTo(24, -3, 12, -8);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(90,104,120,.55)";
    g.lineWidth = 1.4;
    g.stroke();

    // nose cone
    g.fillStyle = "#e2574c";
    g.beginPath();
    g.moveTo(13, -8);
    g.quadraticCurveTo(25, -3, 25, 0);
    g.quadraticCurveTo(25, 3, 13, 8);
    g.closePath();
    g.fill();

    // window
    const wg = g.createRadialGradient(1, -3, 1, 1, -1, 5);
    wg.addColorStop(0, "#d8f2ff");
    wg.addColorStop(1, "#4b90b8");
    g.fillStyle = wg;
    g.beginPath(); g.arc(2, -1, 4.6, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(70,96,120,.7)";
    g.lineWidth = 1.3; g.stroke();

    // band
    g.fillStyle = "#e2574c";
    g.fillRect(-9, -8, 4, 16);
  }

  /* --- paper plane ------------------------------------------------ */
  function drawPaperPlane(g, s) {
    const flutter = Math.sin(s.phase * 1.6) * 1.4;

    // shadowed lower fold
    g.fillStyle = "#c9d4de";
    g.beginPath();
    g.moveTo(22, 0);
    g.lineTo(-16, 12 + flutter);
    g.lineTo(-8, 0);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(120,136,152,.7)";
    g.lineWidth = 1.2;
    g.stroke();

    // upper fold
    const pg = g.createLinearGradient(-16, -14, 22, 0);
    pg.addColorStop(0, "#ffffff");
    pg.addColorStop(1, "#eef3f8");
    g.fillStyle = pg;
    g.beginPath();
    g.moveTo(22, 0);
    g.lineTo(-16, -12 - flutter);
    g.lineTo(-8, 0);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(120,136,152,.8)";
    g.lineWidth = 1.2;
    g.stroke();

    // centre crease
    g.strokeStyle = "rgba(140,158,176,.9)";
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(22, 0);
    g.lineTo(-8, 0);
    g.stroke();

    // small highlight
    g.fillStyle = "rgba(255,255,255,.9)";
    g.beginPath();
    g.moveTo(20, -1);
    g.lineTo(-10, -9 - flutter * 0.6);
    g.lineTo(-6, -1);
    g.closePath();
    g.fill();
  }

  /* --- auto-rickshaw ---------------------------------------------- */
  function drawAuto(g, s) {
    const spin = s.phase * 2;

    // wheels
    function wheel(cx, cy, r) {
      g.fillStyle = "#20242a";
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#4a525c";
      g.beginPath(); g.arc(cx, cy, r * 0.45, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(255,255,255,.45)";
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(cx + Math.cos(spin) * r * 0.7, cy + Math.sin(spin) * r * 0.7);
      g.lineTo(cx - Math.cos(spin) * r * 0.7, cy - Math.sin(spin) * r * 0.7);
      g.stroke();
    }

    // body
    const bg = g.createLinearGradient(0, -12, 0, 10);
    bg.addColorStop(0, "#ffe066");
    bg.addColorStop(0.6, "#f5c518");
    bg.addColorStop(1, "#d9a409");
    g.fillStyle = bg;
    g.beginPath();
    g.moveTo(-16, 6);
    g.lineTo(-16, -6);
    g.quadraticCurveTo(-10, -12, 4, -12);
    g.lineTo(14, -6);
    g.quadraticCurveTo(17, 0, 14, 6);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(120,88,8,.6)";
    g.lineWidth = 1.5;
    g.stroke();

    // black roof
    g.fillStyle = "#262b31";
    g.beginPath();
    g.moveTo(-15, -6);
    g.quadraticCurveTo(-9, -12.5, 4, -12.5);
    g.lineTo(4, -8);
    g.quadraticCurveTo(-8, -8, -12, -5);
    g.closePath();
    g.fill();

    // windshield
    g.fillStyle = "rgba(150,210,235,.85)";
    g.beginPath();
    g.moveTo(6, -7.5);
    g.lineTo(13, -4);
    g.lineTo(13, 1);
    g.lineTo(6, 1);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(90,120,140,.7)";
    g.lineWidth = 1;
    g.stroke();

    // green stripe
    g.fillStyle = "#2f7d4f";
    g.fillRect(-16, 2, 30, 2.4);

    // headlight
    g.fillStyle = "#fff6c8";
    g.beginPath(); g.arc(15, 2.6, 2.2, 0, Math.PI * 2); g.fill();

    wheel(-9, 8, 5.4);
    wheel(9, 8, 5.4);
  }

  /* --- the flying character -------------------------------------- */
  function drawPlayer() {
    const skin = SKINS[G.skin];
    const squash = bird.squash;
    const stretch = clamp(bird.vy / 3400, -0.08, 0.12);
    const sx = 1 + squash * 0.1 - stretch * 0.5;
    const sy = 1 - squash * 0.12 + stretch;
    const bob = Math.sin(bird.wingPhase) * 0.7 * skin.bob;

    ctx.save();
    ctx.translate(bird.x, bird.y + bob);
    ctx.rotate(bird.rot * skin.rotMul);

    // ground shadow
    const distToFloor = (FLOOR_Y - bird.y) / FLOOR_Y;
    ctx.save();
    ctx.globalAlpha = 0.15 * (1 - distToFloor * 0.6);
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(2, FLOOR_Y - bird.y - 4, 18 * (1 - distToFloor * 0.35), 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.scale(sx, sy);
    drawSkin(ctx, skin.id, {
      phase: bird.wingPhase,
      boost: bird.boost,
      blink: bird.blink,
      vy: bird.vy,
      tail: bird.tail,
    });
    ctx.restore();
  }

  /* ---------------------------------------------------------- HUD */
  function drawScore() {
    if (G.state === "ready") return;
    const s = String(Math.round(G.hudScore));
    const pop = 1 + G.scorePop * 0.15;
    ctx.save();
    ctx.translate(VW / 2, 128);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "800 76px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.lineJoin = "round";
    ctx.lineWidth = 12;
    ctx.strokeStyle = "rgba(14,28,44,.45)";
    ctx.strokeText(s, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(s, 0, 0);
    ctx.restore();
  }

  function drawRipples() {
    for (const r of G.ripples) {
      const a = Math.max(0, r.life / r.max);
      const rad = 8 + (1 - a) * 42;
      ctx.strokeStyle = "rgba(255,255,255," + (a * 0.35).toFixed(3) + ")";
      ctx.lineWidth = 2 + a * 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function medal(score) {
    if (score >= 40) return { c1: "#f7f9fb", c2: "#b9c6d1", n: "PLATINUM" };
    if (score >= 25) return { c1: "#ffe89a", c2: "#d9a41f", n: "GOLD" };
    if (score >= 12) return { c1: "#f0f4f8", c2: "#a9b6c2", n: "SILVER" };
    if (score >= 5)  return { c1: "#f0c08a", c2: "#a86a2e", n: "BRONZE" };
    return null;
  }

  function drawTitle() {
    const cx = VW / 2;
    const skin = SKINS[G.skin];
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // wordmark, breathing very slightly
    const breathe = 1 + Math.sin(G.t * 1.5) * 0.012;
    ctx.save();
    ctx.translate(cx, 172);
    ctx.scale(breathe, breathe);
    ctx.font = "900 86px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.lineJoin = "round";
    ctx.lineWidth = 16;
    ctx.strokeStyle = "rgba(12,30,48,.5)";
    ctx.strokeText("FLY", 0, 0);
    const tg = ctx.createLinearGradient(0, -44, 0, 42);
    tg.addColorStop(0, "#ffffff");
    tg.addColorStop(0.55, "#ffe9a3");
    tg.addColorStop(1, "#ffc53d");
    ctx.fillStyle = tg;
    ctx.fillText("FLY", 0, 0);
    ctx.restore();

    // which character is flying
    ctx.font = "800 13px ui-rounded, Segoe UI, system-ui, sans-serif";
    const label = skin.label;
    const bw2 = Math.max(104, ctx.measureText(label).width + 44), bh2 = 32;
    const bx2 = cx - bw2 / 2, by2 = 224 - bh2 / 2;
    ctx.fillStyle = "rgba(10,26,42,.46)";
    roundRect(ctx, bx2, by2, bw2, bh2, 16); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = "#8ce07a";
    ctx.beginPath(); ctx.arc(bx2 + 17, by2 + bh2 / 2, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, bx2 + bw2 / 2 + 8, by2 + bh2 / 2 + 1);

    ctx.font = "700 14px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.78)";
    ctx.fillText("TAP  ·  FLAP  ·  DON'T CRASH", cx, 272);

    if (G.best > 0) {
      const bw = 150, bh = 36, bx = cx - bw / 2, by = 296;
      ctx.fillStyle = "rgba(10,26,42,.42)";
      roundRect(ctx, bx, by, bw, bh, 18); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#ffe9a3";
      ctx.font = "800 15px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.fillText("BEST  " + G.best, cx, by + bh / 2 + 1);
    }

    const pulse = 0.5 + 0.5 * Math.sin(G.t * 3.2);
    ctx.globalAlpha = 0.45 + pulse * 0.55;
    ctx.font = "800 22px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.lineJoin = "round";
    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(14,30,48,.35)";
    ctx.strokeText("TAP TO START", cx, FLOOR_Y - 168);
    ctx.fillText("TAP TO START", cx, FLOOR_Y - 168);
    ctx.globalAlpha = 1;

    ctx.font = "600 12px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText("SPACE / ↑ / W  ·  M mute  ·  F fullscreen", cx, FLOOR_Y - 140);

    // swipe hint, gently nudging left and right
    const nudge = Math.sin(G.t * 2.2) * 4;
    ctx.font = "700 12px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.62)";
    ctx.fillText("←   SWIPE TO CHANGE   →", cx + nudge, FLOOR_Y - 42);
    ctx.restore();
  }

  function drawOver() {
    const t = clamp((G.t - G.overAt) / 0.3, 0, 1);
    const e = 1 - Math.pow(1 - t, 3);

    ctx.save();
    ctx.globalAlpha = e * 0.35;
    ctx.fillStyle = "#08131f";
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(0, (1 - e) * 46);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const cw = Math.min(340, VW - 48), ch = 292;
    const cx = (VW - cw) / 2, cy = VH * 0.2;

    ctx.fillStyle = "rgba(10,24,40,.8)";
    roundRect(ctx, cx, cy, cw, ch, 26); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 2; ctx.stroke();

    ctx.font = "900 30px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = G.newBest ? "#ffe9a3" : "#ffffff";
    ctx.fillText(G.newBest ? "NEW BEST!" : "GAME OVER", VW / 2, cy + 46);

    const m = medal(G.score);
    const mx = cx + 68, my = cy + 142;
    if (m) {
      const mg = ctx.createRadialGradient(mx - 8, my - 10, 4, mx, my, 34);
      mg.addColorStop(0, m.c1);
      mg.addColorStop(1, m.c2);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.ellipse(mx - 9, my - 11, 8, 5, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(20,32,48,.9)";
      ctx.font = "800 9px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.fillText(m.n, mx, my + 46);
    } else {
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.font = "700 13px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText("SCORE", cx + cw - 44, cy + 116);
    ctx.fillText("BEST", cx + cw - 44, cy + 172);

    ctx.textAlign = "left";
    ctx.fillStyle = "#ffffff";
    ctx.font = "900 38px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText(String(G.score), cx + 124, cy + 124);
    ctx.fillStyle = "#ffd257";
    ctx.font = "900 28px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText(String(G.best), cx + 124, cy + 180);

    // local top five
    if (G.top.length) {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.42)";
      ctx.font = "800 10px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.fillText("TOP SCORES", VW / 2, cy + 214);

      const n = G.top.length, chipW = 44, gap = 8;
      const totalW = n * chipW + (n - 1) * gap;
      let sx = cx + (cw - totalW) / 2;
      let marked = false;
      for (let i = 0; i < n; i++) {
        const val = G.top[i].s;
        const isThis = !marked && val === G.score;
        if (isThis) marked = true;
        ctx.fillStyle = isThis ? "rgba(255,214,87,.26)" : (i === 0 ? "rgba(255,214,87,.12)" : "rgba(255,255,255,.07)");
        roundRect(ctx, sx, cy + 226, chipW, 28, 9); ctx.fill();
        if (isThis) {
          ctx.strokeStyle = "rgba(255,214,87,.7)"; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.fillStyle = isThis ? "#ffe9a3" : (i === 0 ? "#ffd257" : "rgba(255,255,255,.78)");
        ctx.font = "800 14px ui-rounded, Segoe UI, system-ui, sans-serif";
        ctx.fillText(String(val), sx + chipW / 2, cy + 240);
        sx += chipW + gap;
      }
    }

    ctx.textAlign = "center";
    const pulse = 0.5 + 0.5 * Math.sin(G.t * 4);
    ctx.globalAlpha = e * (0.5 + pulse * 0.5);
    ctx.fillStyle = "#ffffff";
    ctx.font = "800 16px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillText("TAP TO PLAY AGAIN", VW / 2, cy + ch + 30);
    ctx.restore();
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.42, VW / 2, VH / 2, Math.max(VW, VH) * 0.78);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(4,12,22,.34)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }

  /* ---------------------------------------------------------- render */
  function drawPopups() {
    for (const q of G.popups) {
      const a = Math.max(0, q.life / q.max);
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 20px ui-rounded, Segoe UI, system-ui, sans-serif";
      ctx.lineJoin = "round";
      ctx.lineWidth = 7;
      ctx.strokeStyle = "rgba(14,28,44,.5)";
      ctx.strokeText(q.text, q.x, q.y);
      ctx.fillStyle = q.col;
      ctx.fillText(q.text, q.x, q.y);
      ctx.restore();
    }
  }

  function drawPause() {
    ctx.save();
    ctx.fillStyle = "rgba(8,18,32,.55)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 44px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("PAUSED", VW / 2, VH * 0.42);
    const pulse = 0.5 + 0.5 * Math.sin(G.t * 4);
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.font = "800 15px ui-rounded, Segoe UI, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillText("TAP TO RESUME", VW / 2, VH * 0.42 + 42);
    ctx.restore();
  }

  function render() {
    dayP = G.state === "ready" ? 0 : clamp(G.score / 38, 0, 1);

    ctx.save();
    if (G.shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }
    drawSky();
    for (const c of G.clouds) drawCloud(c.x, c.y, c.s, c.a);
    drawFarBirds();
    drawHills();
    drawPipes();
    drawGround();
    drawParticles("back");
    drawPlayer();
    drawParticles("front");
    drawRipples();
    ctx.restore();

    // night wash over the whole scene, under the HUD
    if (dayP > 0.01) {
      ctx.fillStyle = "rgba(8,16,34," + (dayP * 0.42).toFixed(3) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }

    drawVignette();

    if (G.flash > 0.02) {
      ctx.fillStyle = "rgba(255,255,255," + (G.flash * 0.18).toFixed(3) + ")";
      ctx.fillRect(0, 0, VW, VH);
    }

    drawScore();
    drawPopups();
    if (G.state === "ready") drawTitle();
    if (G.state === "over") drawOver();
    if (G.paused) drawPause();
  }

  /* ---------------------------------------------------------- loop */
  const STEP = 1 / 240;
  let prev = performance.now();
  let acc = 0;
  let lastPickerState = null;

  function frame(now) {
    let dt = (now - prev) / 1000;
    prev = now;
    if (dt > 0.25) dt = 0.25;

    if (G.paused) {
      acc = 0;
    } else {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 60) {
        update(STEP);
        acc -= STEP;
      }
      if (guard >= 60) acc = 0;
    }

    if (lastPickerState !== G.state) {
      lastPickerState = G.state;
      syncPickerVisibility();
      syncShareVisibility();
    }

    render();
    requestAnimationFrame(frame);
  }

  applyMode();
  resize();
  reset();
  syncPickerVisibility();
  syncShareVisibility();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
